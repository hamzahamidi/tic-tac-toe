name: build-and-deploy

on:
  push:
    branches-ignore: ["uat/**"]
  workflow_dispatch:
    inputs:
      is_release:
        description: Upload UAT evidence to S3
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  check:
    runs-on: namespace-profile-first
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck

  build:
    runs-on: namespace-profile-first
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/ci/build.sh staging
      - run: scripts/ci/build.sh production
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  infra-check:
    needs: build
    runs-on: namespace-profile-first
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21"
          cache: yarn
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - run: yarn install --frozen-lockfile
      - run: npx cdk synth --quiet

  preview-staging:
    needs: build
    runs-on: namespace-profile-first
    permissions:
      contents: read
      id-token: write
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21"
          cache: yarn
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: yarn install --frozen-lockfile
      - run: scripts/ci/preview.sh staging

  deploy-staging:
    needs: [check, infra-check, preview-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: namespace-profile-first
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21"
          cache: yarn
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: yarn install --frozen-lockfile
      - run: scripts/ci/deploy.sh staging

  e2e-staging:
    needs: deploy-staging
    permissions:
      contents: read
      id-token: write
      checks: write
    uses: ./.github/workflows/uat.yml
    with:
      environment: staging
      is_release: ${{ inputs.is_release == true }}

  preview-production:
    needs: deploy-staging
    runs-on: namespace-profile-first
    permissions:
      contents: read
      id-token: write
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21"
          cache: yarn
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: yarn install --frozen-lockfile
      - run: scripts/ci/preview.sh production

  # The production environment's required reviewers are the approval gate.
  deploy-production:
    needs: [e2e-staging, preview-production]
    runs-on: namespace-profile-first
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21"
          cache: yarn
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: yarn install --frozen-lockfile
      - run: scripts/ci/deploy.sh production

  e2e-production:
    needs: deploy-production
    permissions:
      contents: read
      id-token: write
      checks: write
    uses: ./.github/workflows/uat.yml
    with:
      environment: production
      is_release: ${{ inputs.is_release == true }}
